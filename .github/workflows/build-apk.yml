name: Build Fitbit Air APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: gg
          environment-file: environment.yml
          auto-activate-base: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;23.0.7599858" \
            "cmake;3.10.2.4988404"

      - name: Build Golden Gate Android core
        shell: bash -l {0}
        run: |
          inv android.library.build

      - name: Build APK
        shell: bash -l {0}
        run: |
          cd platform/android/goldengate
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitbit-Air-Notification-Bridge
          path: platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk
