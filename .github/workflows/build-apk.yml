name: Build Fitbit Air APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Golden Gate build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "invoke==1.3.0" \
            "semver==2.8.1" \
            "cmake==3.23.3" \
            "ninja==1.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;23.0.7599858" \
            "cmake;3.10.2.4988404"

      - name: Build Golden Gate Android core
        run: |
          inv android.library.build --profile=arm64-v8a

      - name: Build APK
        run: |
          cd platform/android/goldengate
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitbit-Air-Notification-Bridge
          path: platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
