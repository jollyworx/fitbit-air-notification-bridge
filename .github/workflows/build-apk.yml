name: Build Fitbit Air APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'platform/android/goldengate/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Golden Gate build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "invoke==1.3.0" \
            "semver==2.8.1" \
            "cmake==3.23.3" \
            "ninja==1.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.0.7599858" \
            "cmake;3.10.2.4988404"

      - name: Build Golden Gate Android core
        env:
          LDFLAGS: "-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
        run: |
          inv android.library.build --profile=arm64-v8a

      - name: Build APK
        run: |
          cd platform/android/goldengate
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK architecture and signature
        run: |
          APK=platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -qx "targetSdkVersion:'34'"
          python - <<'PY'
          import hashlib
          import struct
          import zipfile
          from pathlib import Path
          apk = Path("platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(apk) as archive:
              libs = [name for name in archive.namelist() if name.startswith("lib/") and name.endswith(".so")]
              assert libs, "No native libraries in APK"
              assert {name.split("/")[1] for name in libs} == {"arm64-v8a"}, libs
              assert {"libgg.so", "libxp.so"} <= {name.split("/")[-1] for name in libs}, libs
              for name in libs:
                  data = archive.read(name)
                  assert data[:6] == b"\x7fELF\x02\x01", name
                  assert struct.unpack_from("<H", data, 18)[0] == 183, name
                  phoff = struct.unpack_from("<Q", data, 32)[0]
                  phentsize, phnum = struct.unpack_from("<HH", data, 54)
                  loads = []
                  for index in range(phnum):
                      segment = struct.unpack_from("<IIQQQQQQ", data, phoff + index * phentsize)
                      kind, flags, offset, vaddr, paddr, filesz, memsz, align = segment
                      if kind == 1:
                          assert align >= 16384, (name, align)
                          loads.append(align)
                      if kind == 0x6474e552:
                          assert (vaddr + memsz) % 16384 == 0, (name, "unaligned RELRO")
                  assert loads, name
                  assert archive.getinfo(name).compress_type == zipfile.ZIP_DEFLATED, name
                  print("Verified AArch64 ELF, 16 KB LOAD alignment and compressed packaging:", name)
          checksum = hashlib.sha256(apk.read_bytes()).hexdigest()
          apk.with_suffix(".apk.sha256").write_text(checksum + "  " + apk.name + "\n")
          print("APK SHA256:", checksum)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitbit-Air-Notification-Bridge
          path: |
            platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk
            platform/android/goldengate/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
